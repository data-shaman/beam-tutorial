services:
  duckdb:
    image: ubuntu:20.04
    container_name: duckdb_warehouse
    volumes:
      - duckdb_data:/data
    ports:
      - "9000:9000"
    command: >
      bash -c "
      apt-get update &&
      apt-get install -y wget unzip &&
      wget https://github.com/duckdb/duckdb/releases/download/v1.1.3/duckdb_cli-linux-amd64.zip && 
      unzip duckdb_cli-linux-amd64.zip && 
      mv duckdb /usr/local/bin/duckdb &&
      chmod +x /usr/local/bin/duckdb &&
      /usr/local/bin/duckdb /data/warehouse.duckdb -c 'SELECT 1;' &&
      tail -f /dev/null"
    
  
  apache_beam:
    image: apache/beam_python3.11_sdk:latest
    container_name: beam_processor
    environment:
      POSTGRES_HOST: postgres_container
      POSTGRES_DB: website_events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Passw0rd
      DUCKDB_PATH: /data/warehouse.db
    volumes:
      - duckdb_data:/data
      - ./beam_pipeline/pipeline.py:/pipeline.py
    networks:
      - beam-tutorial_default
    command: ["bash", "-c", "pip install duckdb", "python pipeline.py"]


volumes:
  duckdb_data:


networks:
  beam-tutorial_default:
    external: true

  